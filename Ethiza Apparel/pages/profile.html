<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Ethiza Apparel</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      
      <nav>
        <ul class="nav-menu">
          <li><a href="home.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-icons">
        <button class="icon-btn" onclick="window.location='wishlist.html'" title="Wishlist">
          ❤️
          <span class="badge wishlist-badge hidden">0</span>
        </button>
        <button class="icon-btn" onclick="window.location='cart.html'" title="Cart">
          🛒
          <span class="badge cart-badge hidden">0</span>
        </button>
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪</button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="container page-container" style="max-width: 800px;">
      <h1 style="font-size: 36px; font-family: Georgia, serif; color: #3d3d3d; margin-bottom: var(--spacing-xl);">My Profile</h1>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-xl);">
        <div>
          <div class="card">
            <h3 style="color: #8b6f47; margin-bottom: var(--spacing-lg);">Account Information</h3>
            <div id="profile-info"></div>
          </div>
        </div>

        <div>
          <div class="card">
            <h3 style="color: #8b6f47; margin-bottom: var(--spacing-lg);">Order History</h3>
            <div id="order-history"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h4>About Ethiza Apparel</h4>
        <p style="font-size: 13px;">Premium women's fashion for every occasion.</p>
      </div>
      <div class="footer-section">
        <h4>Quick Links</h4>
        <ul>
          <li><a href="home.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = {
      currentUser: null,
      orders: []
    };

    function initPage() {
      const userData = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!userData) {
        window.location = 'login.html';
        return;
      }

      app.currentUser = userData;
      try {
        app.orders = JSON.parse(localStorage.getItem('orders')) || [];
      } catch (error) {
        console.error('Error loading orders:', error);
      }

      displayProfile();
      displayOrders();
    }

    function displayProfile() {
      const profileInfo = document.getElementById('profile-info');
      profileInfo.innerHTML = `
        <div style="margin-bottom: var(--spacing-lg);">
          <p style="color: #6b6b6b; font-size: 12px; margin-bottom: var(--spacing-sm);">NAME</p>
          <p style="font-size: 16px; font-weight: 600; color: #3d3d3d;">${app.currentUser.name}</p>
        </div>
        <div style="margin-bottom: var(--spacing-lg);">
          <p style="color: #6b6b6b; font-size: 12px; margin-bottom: var(--spacing-sm);">EMAIL</p>
          <p style="font-size: 16px; font-weight: 600; color: #3d3d3d;">${app.currentUser.email}</p>
        </div>
        <div style="margin-bottom: var(--spacing-lg);">
          <p style="color: #6b6b6b; font-size: 12px; margin-bottom: var(--spacing-sm);">MEMBER SINCE</p>
          <p style="font-size: 14px; color: #6b6b6b;">${new Date(app.currentUser.createdAt).toLocaleDateString()}</p>
        </div>
        <button class="btn btn-secondary" onclick="handleLogout()">Logout</button>
      `;
    }

    function displayOrders() {
      const orderHistory = document.getElementById('order-history');
      const userOrders = app.orders.filter(o => o.userId === app.currentUser.id);

      if (userOrders.length === 0) {
        orderHistory.innerHTML = '<p style="color: #6b6b6b;">No orders yet</p>';
        return;
      }

      orderHistory.innerHTML = `
        <table style="width: 100%;">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            ${userOrders.map(order => `
              <tr>
                <td style="padding: 8px; border-bottom: 1px solid #e8ddd5; font-size: 12px;">${order.id.substring(0, 15)}...</td>
                <td style="padding: 8px; border-bottom: 1px solid #e8ddd5; font-size: 12px;">₹${order.total.toLocaleString('en-IN')}</td>
                <td style="padding: 8px; border-bottom: 1px solid #e8ddd5;">
                  <span style="background: ${order.status === 'Delivered' ? '#4caf50' : '#ff9800'}; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px;">${order.status}</span>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      showAlert('Logged out!', 'success');
      setTimeout(() => window.location = 'home.html', 1000);
    }

    function showAlert(message, type = 'success') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.innerHTML = `<span>${message}</span>`;
      document.body.insertBefore(alertDiv, document.body.firstChild);
      setTimeout(() => alertDiv.remove(), 4000);
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
