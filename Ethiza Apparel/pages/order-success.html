<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success - Ethiza Apparel</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      
      <nav>
        <ul class="nav-menu">
          <li><a href="home.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>

      <div class="nav-icons">
        <button class="icon-btn" onclick="window.location='profile.html'" title="Profile">👤</button>
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪</button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="container page-container">
      <div style="text-align: center; max-width: 600px; margin: 0 auto; padding: var(--spacing-2xl); background: var(--white); border-radius: 12px; border: 1px solid #e8ddd5;">
        <div style="font-size: 64px; margin-bottom: var(--spacing-lg); color: #4caf50;">✓</div>
        <h1 style="font-size: 32px; font-family: Georgia, serif; color: #3d3d3d; margin-bottom: var(--spacing-md);">Thank You!</h1>
        <p style="color: #6b6b6b; font-size: 16px; margin-bottom: var(--spacing-lg);">
          Your order has been placed successfully. You will receive updates via email.
        </p>

        <div class="card" style="background: #f5e6e0; margin: var(--spacing-lg) 0; border: none;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-lg);">
            <div>
              <p style="color: #6b6b6b; font-size: 12px; margin-bottom: var(--spacing-sm);">ORDER ID</p>
              <p style="font-size: 14px; font-weight: 600; color: #3d3d3d;" id="success-order-id">---</p>
            </div>
            <div>
              <p style="color: #6b6b6b; font-size: 12px; margin-bottom: var(--spacing-sm);">TOTAL AMOUNT</p>
              <p style="font-size: 14px; font-weight: 600; color: #8b6f47;" id="success-total">₹0</p>
            </div>
          </div>
        </div>

        <button class="btn btn-primary" onclick="window.location='shop.html'" style="width: 100%; margin-top: var(--spacing-lg);">Continue Shopping</button>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h4>About Ethiza Apparel</h4>
        <p style="font-size: 13px;">Premium women's fashion for every occasion.</p>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    function initPage() {
      const orderId = sessionStorage.getItem('lastOrderId');
      if (!orderId) {
        window.location = 'home.html';
        return;
      }

      const orders = JSON.parse(localStorage.getItem('orders')) || [];
      const order = orders.find(o => o.id === orderId);

      if (order) {
        document.getElementById('success-order-id').textContent = order.id;
        document.getElementById('success-total').textContent = '₹' + order.total.toLocaleString('en-IN');
      }
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      window.location = 'home.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
