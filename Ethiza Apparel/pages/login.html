<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Ethiza Apparel</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      <nav>
        <ul class="nav-menu">
          <li><a href="home.html">Home</a></li>
          <li><a href="shop.html">Shop</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
      <div class="nav-icons">
        <button class="icon-btn" onclick="window.location='home.html'">🏠</button>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main>
    <div class="container page-container" style="max-width: 600px;">
      <div id="login-container" class="card">
        <h1 style="font-size: 28px; font-family: Georgia, serif; color: #3d3d3d; text-align: center; margin-bottom: var(--spacing-xl);">Sign In</h1>

        <form id="login-form">
          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="login-email" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required>
          </div>

          <div class="form-group">
            <label style="display: flex; align-items: center; gap: var(--spacing-sm); font-weight: normal;">
              <input type="checkbox" id="admin-checkbox" style="width: 18px; height: 18px; cursor: pointer;">
              Login as Admin
            </label>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--spacing-lg);">Sign In</button>
        </form>

        <div style="text-align: center;">
          <p style="color: #6b6b6b;">Don't have an account? 
            <button class="btn btn-secondary btn-small" onclick="toggleForm(); return false;">Create Account</button>
          </p>
        </div>
      </div>

      <div id="register-container" class="card hidden">
        <h1 style="font-size: 28px; font-family: Georgia, serif; color: #3d3d3d; text-align: center; margin-bottom: var(--spacing-xl);">Create Account</h1>

        <form id="register-form">
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="register-name" required>
          </div>

          <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="register-email" required>
          </div>

          <div class="form-group">
            <label>Password</label>
            <input type="password" id="register-password" required>
          </div>

          <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="register-confirm-password" required>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: var(--spacing-lg);">Create Account</button>
        </form>

        <div style="text-align: center;">
          <p style="color: #6b6b6b;">Already have an account? 
            <button class="btn btn-secondary btn-small" onclick="toggleForm(); return false;">Sign In</button>
          </p>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="footer-container">
      <div class="footer-section">
        <h4>About Ethiza Apparel</h4>
        <p style="font-size: 13px;">Premium women's fashion for every occasion.</p>
      </div>
    </div>

    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = { users: [] };

    function initPage() {
      try {
        app.users = JSON.parse(localStorage.getItem('users')) || [];
      } catch (error) {
        console.error('Error:', error);
      }

      setupForms();
    }

    function toggleForm() {
      document.getElementById('login-container').classList.toggle('hidden');
      document.getElementById('register-container').classList.toggle('hidden');
      document.getElementById('admin-checkbox').checked = false;
    }

    function setupForms() {
      document.getElementById('login-form').addEventListener('submit', handleLogin);
      document.getElementById('register-form').addEventListener('submit', handleRegister);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const isAdmin = document.getElementById('admin-checkbox').checked;

      if (!email || !password) {
        showAlert('Please enter email and password', 'error');
        return;
      }

      if (isAdmin) {
        if (email === 'yashtilala11411@gmail.com' && password === 'yash1313') {
          const adminUser = {
            id: 'admin-' + Date.now(),
            email: email,
            name: 'Admin User',
            isAdmin: true,
            createdAt: new Date().toISOString()
          };
          sessionStorage.setItem('currentUser', JSON.stringify(adminUser));
          showAlert('Admin login successful! Redirecting...', 'success');
          setTimeout(() => window.location = '../admin/dashboard.html', 1200);
        } else {
          showAlert('Invalid admin credentials. Use:\nEmail: yashtilala11411@gmail.com\nPassword: yash1313', 'error');
        }
      } else {
        const user = app.users.find(u => u.email === email && u.password === password);
        if (!user) {
          showAlert('Invalid email or password', 'error');
          return;
        }
        if (user.blocked) {
          showAlert('Your account has been blocked by administrator', 'error');
          return;
        }
        
        sessionStorage.setItem('currentUser', JSON.stringify(user));
        showAlert('Login successful! Redirecting...', 'success');
        setTimeout(() => window.location = 'home.html', 1200);
      }

      document.getElementById('login-form').reset();
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('register-name').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const confirmPassword = document.getElementById('register-confirm-password').value;

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters', 'error');
        return;
      }

      if (password !== confirmPassword) {
        showAlert('Passwords do not match', 'error');
        return;
      }

      if (app.users.some(u => u.email === email)) {
        showAlert('Email already registered', 'error');
        return;
      }

      const newUser = {
        id: Date.now(),
        email: email,
        password: password,
        name: name,
        isAdmin: false,
        createdAt: new Date().toISOString(),
        blocked: false
      };

      app.users.push(newUser);
      localStorage.setItem('users', JSON.stringify(app.users));

      showAlert('Registration successful! Please login.', 'success');
      setTimeout(() => {
        toggleForm();
        document.getElementById('register-form').reset();
      }, 1000);
    }

    function showAlert(message, type = 'success') {
      const alertDiv = document.createElement('div');
      alertDiv.className = `alert alert-${type}`;
      alertDiv.innerHTML = `<span>${message}</span>`;
      document.body.insertBefore(alertDiv, document.body.firstChild);
      setTimeout(() => alertDiv.remove(), 4000);
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
