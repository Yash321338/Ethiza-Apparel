<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Management - Ethiza Apparel Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='../pages/home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      <div style="margin-left: auto;">
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪 Logout</button>
      </div>
    </div>
  </header>

  <!-- ===== ADMIN CONTAINER ===== -->
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <ul class="admin-nav">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="products.html" class="active">📦 Products</a></li>
        <li><a href="orders.html">📋 Orders</a></li>
        <li><a href="users.html">👥 Users</a></li>
        <li><a href="slider.html">🎨 Sliders</a></li>
        <li><a href="profile.html">⚙️ Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>Product Management</h1>
        <button class="btn btn-primary" onclick="toggleAddProductForm()">+ Add New Product</button>
      </div>

      <!-- Add Product Form -->
      <div id="add-product-form" style="display: none; margin-bottom: var(--spacing-xl);" class="card">
        <h3>Add New Product</h3>
        <form onsubmit="addProduct(event)">
          <div class="form-group">
            <label for="product-name">Product Name *</label>
            <input type="text" id="product-name" required>
          </div>
          <div class="form-group">
            <label for="product-category">Category *</label>
            <select id="product-category" required>
              <option value="">Select Category</option>
              <option value="Dress">Dress</option>
              <option value="Tops">Tops</option>
              <option value="Bottoms">Bottoms</option>
              <option value="Ethnic">Ethnic</option>
              <option value="Accessories">Accessories</option>
            </select>
          </div>
          <div class="form-group">
            <label for="product-price">Price (₹) *</label>
            <input type="number" id="product-price" step="0.01" required>
          </div>
          <div class="form-group">
            <label for="product-stock">Stock Quantity *</label>
            <input type="number" id="product-stock" min="0" required>
          </div>
          <div class="form-group">
            <label for="product-description">Description</label>
            <textarea id="product-description" rows="3"></textarea>
          </div>
          <div class="form-group">
            <label for="product-image">Image URL</label>
            <input type="url" id="product-image" placeholder="https://example.com/image.jpg">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="product-min">Min Purchase Qty</label>
              <input type="number" id="product-min" min="1" value="1">
            </div>
            <div class="form-group">
              <label for="product-max">Max Purchase Qty</label>
              <input type="number" id="product-max" min="1" value="10">
            </div>
          </div>
          <button type="submit" class="btn btn-success">Add Product</button>
          <button type="button" class="btn" onclick="toggleAddProductForm()">Cancel</button>
        </form>
      </div>

      <!-- Products Table -->
      <div class="card">
        <h3 style="margin-bottom: var(--spacing-lg);">All Products</h3>
        <div id="products-table"></div>
      </div>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel Admin Panel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = {
      products: [],
      currentUser: null
    };

    function initPage() {
      const userData = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!userData || !userData.isAdmin) {
        window.location = '../pages/login.html';
        return;
      }

      loadData();
      renderProducts();
    }

    function loadData() {
      try {
        app.products = JSON.parse(localStorage.getItem('products')) || getDefaultProducts();
        app.currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function getDefaultProducts() {
      return [
        { id: 1, name: 'Elegant Evening Dress', category: 'Dress', price: 4999, stock: 15, description: 'Beautiful evening wear', image: '', minQty: 1, maxQty: 5 },
        { id: 2, name: 'Silk Blouse Premium', category: 'Tops', price: 1999, stock: 25, description: 'Premium silk blouse', image: '', minQty: 1, maxQty: 5 },
        { id: 3, name: 'Traditional Saree', category: 'Ethnic', price: 3499, stock: 10, description: 'Elegant traditional saree', image: '', minQty: 1, maxQty: 3 }
      ];
    }

    function toggleAddProductForm() {
      const form = document.getElementById('add-product-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
      if (form.style.display === 'block') {
        document.getElementById('product-name').focus();
      }
    }

    function addProduct(e) {
      e.preventDefault();
      const newProduct = {
        id: Date.now(),
        name: document.getElementById('product-name').value,
        category: document.getElementById('product-category').value,
        price: parseFloat(document.getElementById('product-price').value),
        stock: parseInt(document.getElementById('product-stock').value),
        description: document.getElementById('product-description').value || 'Premium product',
        image: document.getElementById('product-image').value || '',
        minQty: parseInt(document.getElementById('product-min').value) || 1,
        maxQty: parseInt(document.getElementById('product-max').value) || 10
      };

      app.products.push(newProduct);
      localStorage.setItem('products', JSON.stringify(app.products));
      
      alert('Product added successfully!');
      e.target.reset();
      toggleAddProductForm();
      renderProducts();
    }

    function editProduct(id) {
      const product = app.products.find(p => p.id === id);
      if (!product) return;

      const newName = prompt('Product Name:', product.name);
      if (newName === null) return;

      const newPrice = prompt('Price (₹):', product.price);
      if (newPrice === null) return;

      const newStock = prompt('Stock Quantity:', product.stock);
      if (newStock === null) return;

      const newImage = prompt('Image URL (leave blank to keep):', product.image || '');
      if (newImage === null) return;

      const newMin = prompt('Min Purchase Qty:', product.minQty || 1);
      if (newMin === null) return;

      const newMax = prompt('Max Purchase Qty:', product.maxQty || 10);
      if (newMax === null) return;

      product.name = newName;
      product.price = parseFloat(newPrice);
      product.stock = parseInt(newStock);
      product.image = newImage || product.image || '';
      product.minQty = parseInt(newMin) || 1;
      product.maxQty = parseInt(newMax) || 10;

      localStorage.setItem('products', JSON.stringify(app.products));
      alert('Product updated successfully!');
      renderProducts();
    }

    function deleteProduct(id) {
      if (confirm('Are you sure you want to delete this product?')) {
        app.products = app.products.filter(p => p.id !== id);
        localStorage.setItem('products', JSON.stringify(app.products));
        alert('Product deleted successfully!');
        renderProducts();
      }
    }

    function renderProducts() {
      const table = document.getElementById('products-table');
      
      if (app.products.length === 0) {
        table.innerHTML = '<p>No products added yet</p>';
        return;
      }

      table.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Image</th>
              <th>Name</th>
              <th>Category</th>
              <th>Price (₹)</th>
              <th>Stock</th>
              <th>Min</th>
              <th>Max</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${app.products.map(product => `
              <tr>
                <td>${product.id}</td>
                <td style="width:80px;">${product.image ? `<img src="${product.image}" alt="${product.name}" style="width:60px;height:60px;object-fit:cover;border-radius:6px;">` : '<div style="width:60px;height:60px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#999;">Img</div>'}</td>
                <td>${product.name}</td>
                <td>${product.category}</td>
                <td>${product.price}</td>
                <td>${product.stock}</td>
                <td>${product.minQty || 1}</td>
                <td>${product.maxQty || 10}</td>
                <td>
                  <button class="btn btn-sm" onclick="editProduct(${product.id})">Edit</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteProduct(${product.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      window.location = '../pages/login.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
