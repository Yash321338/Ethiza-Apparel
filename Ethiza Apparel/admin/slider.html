<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slider Management - Ethiza Apparel Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='../pages/home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      <div style="margin-left: auto;">
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪 Logout</button>
      </div>
    </div>
  </header>

  <!-- ===== ADMIN CONTAINER ===== -->
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <ul class="admin-nav">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="orders.html">📋 Orders</a></li>
        <li><a href="users.html">👥 Users</a></li>
        <li><a href="slider.html" class="active">🎨 Sliders</a></li>
        <li><a href="profile.html">⚙️ Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>Slider Management</h1>
        <button class="btn btn-primary" onclick="toggleAddSlideForm()">+ Add New Slide</button>
      </div>

      <!-- Add Slide Form -->
      <div id="add-slide-form" style="display: none; margin-bottom: var(--spacing-xl);" class="card">
        <h3>Add New Slide</h3>
        <form onsubmit="addSlide(event)">
          <div class="form-group">
            <label for="slide-title">Slide Title *</label>
            <input type="text" id="slide-title" placeholder="e.g., Summer Collection" required>
          </div>
          <div class="form-group">
            <label for="slide-subtitle">Subtitle *</label>
            <input type="text" id="slide-subtitle" placeholder="e.g., Up to 50% OFF" required>
          </div>
          <div class="form-group">
            <label for="slide-description">Description</label>
            <textarea id="slide-description" rows="3" placeholder="Slide description"></textarea>
          </div>
          <div class="form-group">
            <label for="slide-button-text">Button Text</label>
            <input type="text" id="slide-button-text" placeholder="e.g., Shop Now">
          </div>
          <div class="form-group">
            <label for="slide-color">Background Color</label>
            <input type="color" id="slide-color" value="#f5e6e0">
          </div>
          <button type="submit" class="btn btn-success">Add Slide</button>
          <button type="button" class="btn" onclick="toggleAddSlideForm()">Cancel</button>
        </form>
      </div>

      <!-- Slides Grid -->
      <div class="card">
        <h3 style="margin-bottom: var(--spacing-lg);">Slider Slides</h3>
        <div id="slides-grid" class="product-grid"></div>
      </div>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel Admin Panel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = {
      sliders: [],
      currentUser: null
    };

    function initPage() {
      const userData = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!userData || !userData.isAdmin) {
        window.location = '../pages/login.html';
        return;
      }

      loadData();
      renderSlides();
    }

    function loadData() {
      try {
        app.sliders = JSON.parse(localStorage.getItem('sliders')) || getDefaultSliders();
        app.currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function getDefaultSliders() {
      return [
        {
          id: 1,
          title: 'Luxury Collection 2024',
          subtitle: 'Exclusive & Premium',
          description: 'Discover our new luxury fashion collection',
          buttonText: 'Shop Now',
          color: '#f5e6e0'
        }
      ];
    }

    function toggleAddSlideForm() {
      const form = document.getElementById('add-slide-form');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
      if (form.style.display === 'block') {
        document.getElementById('slide-title').focus();
      }
    }

    function addSlide(e) {
      e.preventDefault();
      const newSlide = {
        id: Date.now(),
        title: document.getElementById('slide-title').value,
        subtitle: document.getElementById('slide-subtitle').value,
        description: document.getElementById('slide-description').value,
        buttonText: document.getElementById('slide-button-text').value || 'Shop Now',
        color: document.getElementById('slide-color').value
      };

      app.sliders.push(newSlide);
      localStorage.setItem('sliders', JSON.stringify(app.sliders));
      
      alert('Slide added successfully!');
      e.target.reset();
      toggleAddSlideForm();
      renderSlides();
    }

    function editSlide(id) {
      const slide = app.sliders.find(s => s.id === id);
      if (!slide) return;

      const newTitle = prompt('Slide Title:', slide.title);
      if (newTitle === null) return;

      const newSubtitle = prompt('Subtitle:', slide.subtitle);
      if (newSubtitle === null) return;

      slide.title = newTitle;
      slide.subtitle = newSubtitle;
      slide.description = prompt('Description:', slide.description) || slide.description;
      slide.buttonText = prompt('Button Text:', slide.buttonText) || slide.buttonText;

      localStorage.setItem('sliders', JSON.stringify(app.sliders));
      alert('Slide updated successfully!');
      renderSlides();
    }

    function deleteSlide(id) {
      if (confirm('Are you sure you want to delete this slide?')) {
        app.sliders = app.sliders.filter(s => s.id !== id);
        localStorage.setItem('sliders', JSON.stringify(app.sliders));
        alert('Slide deleted successfully!');
        renderSlides();
      }
    }

    function renderSlides() {
      const grid = document.getElementById('slides-grid');
      
      if (app.sliders.length === 0) {
        grid.innerHTML = '<p>No slides added yet</p>';
        return;
      }

      grid.innerHTML = app.sliders.map(slide => `
        <div class="card" style="background: ${slide.color}; position: relative;">
          <h4>${slide.title}</h4>
          <p style="color: #8b6f47; font-size: 14px;">${slide.subtitle}</p>
          <p style="font-size: 12px; color: #666; margin: 8px 0;">${slide.description}</p>
          <p style="font-size: 11px; color: #999;">ID: ${slide.id}</p>
          <div style="display: flex; gap: 8px; margin-top: 12px;">
            <button class="btn btn-sm" onclick="editSlide(${slide.id})">Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteSlide(${slide.id})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      window.location = '../pages/login.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
