<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management - Ethiza Apparel Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='../pages/home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      <div style="margin-left: auto;">
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪 Logout</button>
      </div>
    </div>
  </header>

  <!-- ===== ADMIN CONTAINER ===== -->
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <ul class="admin-nav">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="orders.html">📋 Orders</a></li>
        <li><a href="users.html" class="active">👥 Users</a></li>
        <li><a href="slider.html">🎨 Sliders</a></li>
        <li><a href="profile.html">⚙️ Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>User Management</h1>
      </div>

      <div class="card">
        <h3 style="margin-bottom: var(--spacing-lg);">All Users</h3>
        <div id="users-table"></div>
      </div>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel Admin Panel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = {
      users: [],
      currentUser: null
    };

    function initPage() {
      const userData = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!userData || !userData.isAdmin) {
        window.location = '../pages/login.html';
        return;
      }

      loadData();
      renderUsers();
    }

    function loadData() {
      try {
        app.users = JSON.parse(localStorage.getItem('users')) || [];
        app.currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString();
    }

    function blockUser(userId) {
      const user = app.users.find(u => u.id === userId);
      if (!user) return;

      user.blocked = !user.blocked;
      localStorage.setItem('users', JSON.stringify(app.users));
      alert(user.blocked ? 'User blocked successfully!' : 'User unblocked successfully!');
      renderUsers();
    }

    function deleteUser(userId) {
      if (confirm('Are you sure you want to delete this user permanently?')) {
        app.users = app.users.filter(u => u.id !== userId);
        localStorage.setItem('users', JSON.stringify(app.users));
        alert('User deleted successfully!');
        renderUsers();
      }
    }

    function viewUserDetails(userId) {
      const user = app.users.find(u => u.id === userId);
      if (!user) return;

      const details = `
User ID: ${user.id}
Name: ${user.name}
Email: ${user.email}
Member Since: ${formatDate(user.createdAt)}
Status: ${user.blocked ? 'Blocked' : 'Active'}
      `;
      alert(details);
    }

    function renderUsers() {
      const table = document.getElementById('users-table');
      
      if (app.users.length === 0) {
        table.innerHTML = '<p>No users registered yet</p>';
        return;
      }

      table.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Member Since</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${app.users.map(user => `
              <tr>
                <td>${user.id}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>${formatDate(user.createdAt)}</td>
                <td><span style="color: ${user.blocked ? '#f44336' : '#4caf50'}; font-weight: bold;">${user.blocked ? 'Blocked' : 'Active'}</span></td>
                <td>
                  <button class="btn btn-sm" onclick="viewUserDetails(${user.id})">View</button>
                  <button class="btn btn-sm ${user.blocked ? 'btn-success' : 'btn-warning'}" onclick="blockUser(${user.id})">${user.blocked ? 'Unblock' : 'Block'}</button>
                  <button class="btn btn-sm btn-danger" onclick="deleteUser(${user.id})">Delete</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      window.location = '../pages/login.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
