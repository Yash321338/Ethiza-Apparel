<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Management - Ethiza Apparel Admin</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header>
    <div class="header-container">
      <div class="logo" onclick="window.location='../pages/home.html'" style="cursor: pointer;">✨ Ethiza Apparel</div>
      <div style="margin-left: auto;">
        <button class="icon-btn logout-btn" onclick="handleLogout(); return false;" title="Logout">🚪 Logout</button>
      </div>
    </div>
  </header>

  <!-- ===== ADMIN CONTAINER ===== -->
  <div class="admin-container">
    <!-- Sidebar -->
    <aside class="admin-sidebar">
      <ul class="admin-nav">
        <li><a href="dashboard.html">📊 Dashboard</a></li>
        <li><a href="products.html">📦 Products</a></li>
        <li><a href="orders.html" class="active">📋 Orders</a></li>
        <li><a href="users.html">👥 Users</a></li>
        <li><a href="slider.html">🎨 Sliders</a></li>
        <li><a href="profile.html">⚙️ Profile</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-main">
      <div class="admin-header">
        <h1>Order Management</h1>
      </div>

      <div class="card">
        <h3 style="margin-bottom: var(--spacing-lg);">All Orders</h3>
        <div id="orders-table"></div>
      </div>
    </main>
  </div>

  <!-- ===== FOOTER ===== -->
  <footer style="margin-top: auto;">
    <div class="footer-bottom">
      <p>&copy; 2024 Ethiza Apparel Admin Panel. All rights reserved.</p>
    </div>
  </footer>

  <!-- ===== SCRIPTS ===== -->
  <script>
    const app = {
      orders: [],
      users: [],
      currentUser: null
    };

    function initPage() {
      const userData = JSON.parse(sessionStorage.getItem('currentUser'));
      if (!userData || !userData.isAdmin) {
        window.location = '../pages/login.html';
        return;
      }

      loadData();
      renderOrders();
    }

    function loadData() {
      try {
        app.orders = JSON.parse(localStorage.getItem('orders')) || [];
        app.users = JSON.parse(localStorage.getItem('users')) || [];
        app.currentUser = JSON.parse(sessionStorage.getItem('currentUser'));
      } catch (error) {
        console.error('Error loading data:', error);
      }
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR' }).format(amount);
    }

    function formatDate(dateString) {
      return new Date(dateString).toLocaleDateString();
    }

    function updateOrderStatus(orderId) {
      const order = app.orders.find(o => o.id === String(orderId).trim());
      if (!order) {
        alert('Order not found');
        return;
      }

      const statuses = ['Pending', 'Processing', 'Shipped', 'Delivered', 'Cancelled'];
      const currentIndex = statuses.indexOf(order.status);
      const newStatus = statuses[(currentIndex + 1) % statuses.length];
      
      order.status = newStatus;
      localStorage.setItem('orders', JSON.stringify(app.orders));
      alert(`Order status updated to: ${newStatus}`);
      renderOrders();
    }

    function viewOrderDetails(orderId) {
      const order = app.orders.find(o => o.id === String(orderId).trim());
      if (!order) {
        alert('Order not found');
        return;
      }
      
      const user = app.users.find(u => u.id === order.userId);

      const details = `
Order ID: ${order.id}
Customer: ${user ? user.name : 'Unknown'}
Email: ${user ? user.email : 'N/A'}
Amount: ${formatCurrency(order.total)}
Status: ${order.status}
Payment Method: ${order.paymentMethod}
Delivery Address: ${order.shippingAddress.address}, ${order.shippingAddress.city}, ${order.shippingAddress.state} ${order.shippingAddress.pincode}
Date: ${formatDate(order.createdAt)}
Items: ${order.items.map(item => `${item.name} x${item.quantity}`).join(', ')}
      `;
      alert(details);
    }

    function renderOrders() {
      const table = document.getElementById('orders-table');
      
      if (app.orders.length === 0) {
        table.innerHTML = '<p>No orders placed yet</p>';
        return;
      }

      table.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Amount</th>
              <th>Payment Method</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            ${app.orders.map(order => {
              const user = app.users.find(u => u.id === order.userId);
              const statusColor = order.status === 'Delivered' ? '#4caf50' : order.status === 'Cancelled' ? '#f44336' : '#ff9800';
              return `
                <tr>
                  <td>${order.id}</td>
                  <td>${user ? user.name : 'Unknown'}</td>
                  <td>${formatCurrency(order.total)}</td>
                  <td>${order.paymentMethod}</td>
                  <td><span style="background: ${statusColor}; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px;">${order.status}</span></td>
                  <td>${formatDate(order.createdAt)}</td>
                  <td>
                    <button class="btn btn-sm" onclick="viewOrderDetails('${order.id}')">View</button>
                    <button class="btn btn-sm btn-success" onclick="updateOrderStatus('${order.id}')">Update Status</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
    }

    function handleLogout() {
      sessionStorage.removeItem('currentUser');
      window.location = '../pages/login.html';
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
